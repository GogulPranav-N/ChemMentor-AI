version: "3.9"

services:
  che-mentor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: che-mentor
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - GEMINI_MAX_TOKENS=${GEMINI_MAX_TOKENS:-1024}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-base-en-v1.5}
      - CHUNK_SIZE=${CHUNK_SIZE:-700}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-100}
      - TOP_K=${TOP_K:-5}
      - UPLOAD_DIR=/app/uploads
      - VECTOR_DB_DIR=/app/vector_db
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      # Persist uploads and FAISS indices across container restarts
      - che_uploads:/app/uploads
      - che_vectordb:/app/vector_db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  che_uploads:
    driver: local
  che_vectordb:
    driver: local
